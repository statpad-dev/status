owner: statpad-dev
repo: status
user-agent: statpad-status

secrets:
  - STATPAD_API_KEY

assignees:
  - pdcolandrea

sites:
  - name: Website
    url: https://statpad.dev
    icon: https://statpad.dev/favicon.svg
    maxResponseTime: 5000
  - name: Docs
    url: https://statpad.dev/docs/get-started/introduction
    icon: https://statpad.dev/favicon.svg
    maxResponseTime: 5000
  - name: Dashboard
    url: https://app.statpad.dev
    icon: https://statpad.dev/favicon.svg
    maxResponseTime: 5000
  - name: REST API
    url: https://api.statpad.dev/v1/leagues
    icon: https://statpad.dev/favicon.svg
    headers:
      - "Authorization: Bearer $STATPAD_API_KEY"
      - "Accept: application/json"
    __dangerous__body_down_if_text_missing: '"data":'
    maxResponseTime: 3000

status-website:
  cname: status.statpad.dev
  logoUrl: https://statpad.dev/favicon.svg
  favicon: https://statpad.dev/favicon.svg
  name: Statpad Status
  introTitle: "**Statpad** system status"
  introMessage: Live availability and response times for the Statpad website, dashboard and REST API, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Statpad
      href: https://statpad.dev
    - title: Docs
      href: https://statpad.dev/docs
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
